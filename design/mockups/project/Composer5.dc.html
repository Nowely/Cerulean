<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — С моделью: две записи одной строкой</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 420px">
<dc-import name="Composer" variant="Две записи" theme="{{theme}}" hint-size="390px,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 420}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
