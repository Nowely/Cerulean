<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — Во Входящих: кнопка «Переместить»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 300px">
<dc-import name="RecordRow" variant="Во Входящих" theme="{{theme}}" hint-size="390px,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 300}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
