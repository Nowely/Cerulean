<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — Подключено без вопросов: «Синхронизировано · только что», вверху «копия в бакете» вместо «копии нет»; уведомление «Из бакета добавлено: 1 страница, 3 записи». «Не удалять при нехватке места» остаётся: неотправленное без сети живёт только здесь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px">
<dc-import name="Flow" start="syncmerged" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark", "system"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
