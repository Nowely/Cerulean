<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — Своя страница: курсор в названии, ниже место для текста; «Начать с»: Список, Список покупок, Список дел</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px">
<dc-import name="Flow" start="newpage" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark", "system"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
