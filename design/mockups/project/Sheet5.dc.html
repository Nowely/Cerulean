<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — Окно посередине, верх на месте</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 600px; height: 760px">
<dc-import name="Sheet" variant="Окно на компьютере" theme="{{theme}}" hint-size="600px,760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 600, "height": 760}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
