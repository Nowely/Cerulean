<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — Через неделю, со сводкой: слева карточки с тем, что в каждой; справа Покупки, новое «Молоко» отмечено полоской слева</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 1440px; height: 900px">
<dc-import name="Flow" start="deskweek" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark", "system"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
