<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cerulean — «Новая страница»: имя пишется прямо в списке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 264px; height: 300px">
<dc-import name="PlaceList" variant="Новая страница" theme="{{theme}}" hint-size="264px,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 264, "height": 300}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
